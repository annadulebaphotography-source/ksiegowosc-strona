<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Księgowość – strona testowa</title>
  <meta name="description" content="Prosta strona testowa na GitHub Pages." />
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f2ea;color:#2f2a24}
    .wrap{max-width:900px;margin:0 auto;padding:64px 20px}
    .card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{margin:0 0 10px;font-size:34px}
    p{margin:0 0 12px;line-height:1.6}
    .badge{display:inline-block;background:#efe6d8;padding:6px 10px;border-radius:999px;font-size:13px}
    a{color:inherit}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">GitHub Pages • projekt treningowy</div>
      <h1>Księgowość (demo)</h1>
      <p>To jest moja testowa strona na GitHubie. Tu będę ćwiczyć layout, menu, SEO i formularze.</p>
      <p><strong>Następny krok:</strong> dodaj <em>kontakt.html</em> i proste menu.</p>
    </div>
  </div>
</body>
</html>
